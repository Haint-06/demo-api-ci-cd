name: Production Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Đăng nhập Postman
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
        
      - name: Chạy collection từ Cloud
        run: postman collection run "59052222-6123f9be-fab7-406b-a9a8-f8b09d8baccf" -e "RestfulBooker_Env.postman_environment.json" -d "booking_data.csv"
